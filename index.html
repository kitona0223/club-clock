<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLUB CLOCK</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  
  <!-- 🌐 Supabase SDK（認証・データベース連携用ライブラリ）の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0b1220;
      --bg2: #10192e;
      --line: #1e2b45;
      --digit: #f4f7fb;
      --accent: #ff7a3d;
      --accent2: #35c9c1;
      --muted: #6f84a8;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(1200px 800px at 50% 30%, var(--bg2), var(--bg));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      overflow: hidden;
      /* 画面長押しでのテキスト選択を防止 */
      user-select: none;
      -webkit-user-select: none;
    }
    .board {
      position: relative;
      width: min(94vw, 1400px);
      padding: clamp(20px, 4vw, 56px) clamp(24px, 5vw, 72px);
      border-radius: 28px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.15));
      text-align: center;
      transition: all 0.3s ease;
    }
    .top-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: clamp(10px, 2vw, 22px);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent2);
      box-shadow: 0 0 14px var(--accent2);
    }
    .label {
      color: var(--muted);
      letter-spacing: 0.5em;
      margin-right: -0.5em;
      font-size: clamp(12px, 1.4vw, 18px);
      text-transform: uppercase;
      font-weight: 600;
    }
    .clock {
      position: relative;
      display: flex;
      align-items: baseline;
      justify-content: center;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .hm-wrap {
      position: relative;
      display: inline-block;
    }
    .time {
      font-size: clamp(90px, 20vw, 300px);
      font-weight: 800;
      color: var(--digit);
      letter-spacing: 0.02em;
      text-shadow: 0 0 40px rgba(255,255,255,0.08);
      font-variant-numeric: tabular-nums;
    }
    .colon {
      display: inline-block;
      color: var(--accent);
      animation: blink 2s steps(1) infinite;
      margin: 0 clamp(4px, 1vw, 14px);
      transform: translateY(-0.08em);
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.25; }
    }
    .seconds {
      position: absolute;
      left: 100%;
      bottom: 0.12em;
      font-size: clamp(32px, 6vw, 90px);
      font-weight: 700;
      color: var(--accent2);
      margin-left: clamp(4px, 0.6vw, 10px);
      text-align: left;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .date-row {
      margin-top: clamp(14px, 3vw, 30px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .date {
      font-size: clamp(20px, 3vw, 40px);
      color: var(--digit);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .weekday {
      font-size: clamp(20px, 3vw, 40px);
      font-weight: 700;
      padding: 4px 20px;
      border-radius: 999px;
      color: var(--bg);
      background: var(--accent);
    }
    .weekday.sun {
      background: #ff5c6e;
    }
    .weekday.sat {
      background: #35c9c1;
    }
    @media (prefers-reduced-motion: reduce) {
      .colon {
        animation: none;
        opacity: 1;
      }
    }

    /* 🔄 スマホを横向きにした時の表示 */
    @media (orientation: landscape) {
      body {
        background: #000000;
      }
      .board {
        width: 100vw;
        height: 100vh;
        border: none;
        background: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0;
        transform: translateY(-3vh);
      }
      .top-line {
        display: flex;
        margin-bottom: 1vh;
      }
      .label {
        font-size: 3vh;
      }
      .dot {
        width: 1.5vh;
        height: 1.5vh;
      }
      .time {
        font-size: 36vh;
      }
      .seconds {
        font-size: 10vh;
        bottom: 0.05em;
      }
      .date-row {
        margin-top: 2vh;
      }
      .date, .weekday {
        font-size: 5vh;
      }
    }

    /* ☕️ 応援ボタン */
    .bmc-container {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
    }
    .bmc-button {
      display: inline-block;
      background-color: #ffdd00;
      color: #000000;
      font-weight: bold;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
    }
    @media (orientation: landscape) {
      .bmc-container {
        display: none !important;
      }
    }

    /* 🔐 認証画面（ログイン・ライセンス認証）用の追加スタイル */
    .auth-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg);
      background: radial-gradient(1200px 800px at 50% 30%, var(--bg2), var(--bg));
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      padding: 20px;
    }
    .auth-card {
      background-color: var(--bg2);
      border: 2px solid var(--line);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .auth-card h2 {
      margin-top: 0;
      color: var(--accent2);
      font-size: clamp(20px, 2.5vw, 24px);
      text-shadow: 0 0 15px rgba(53, 201, 193, 0.3);
      margin-bottom: 12px;
      font-weight: 800;
    }
    .auth-card p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .auth-input {
      width: 100%;
      padding: 12px 16px;
      margin: 8px 0;
      background-color: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--digit);
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
    }
    .auth-input:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 10px rgba(53, 201, 193, 0.15);
    }
    .auth-btn-group {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .auth-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-btn:active {
      transform: scale(0.97);
    }
    .btn-primary { 
      background-color: var(--accent2); 
      color: var(--bg); 
    }
    .btn-secondary { 
      background-color: var(--line); 
      color: var(--digit); 
    }
    .btn-accent { 
      background-color: var(--accent); 
      color: var(--bg); 
      width: 100%;
      margin-top: 12px;
    }
    
    /* ユーティリティ */
    .hidden { 
      display: none !important; 
    }
  </style>
</head>
<body>

  <!-- 🔐 ログイン・ライセンス認証パネル -->
  <div id="auth-panel" class="auth-container">
    <div class="auth-card">
      <h2>🔑 CLUB CLOCK 認証</h2>
      <p id="auth-message">アプリを利用するにはログインとライセンスキーが必要です。</p>
      
      <!-- ① ログイン / 新規登録フォーム -->
      <div id="login-form">
        <input type="email" id="auth-email" placeholder="メールアドレス" class="auth-input">
        <input type="password" id="auth-password" placeholder="パスワード" class="auth-input">
        <div class="auth-btn-group">
          <button onclick="handleLogin()" class="auth-btn btn-primary">ログイン</button>
          <button onclick="handleSignUp()" class="auth-btn btn-secondary">新規登録（無料）</button>
        </div>
      </div>

      <!-- ② ライセンスキー入力フォーム（ログイン完了後に未購入の場合に表示） -->
      <div id="license-form" style="display: none;">
        <p style="color: var(--accent); font-weight: bold;">⚠️ ライセンス認証が必要です。CryptoHouse等で購入したライセンスキーを入力してください。</p>
        <input type="text" id="license-key" placeholder="CLOCK-XXXX-XXXX" class="auth-input">
        <button onclick="handleActivateKey()" class="auth-btn btn-accent">ライセンスを有効化する</button>
        <button onclick="handleLogout()" class="auth-btn btn-secondary" style="margin-top: 12px; width: 100%;">ログアウト</button>
      </div>
    </div>
  </div>

  <!-- ⏱️ CLUB CLOCK メイン画面（デフォルトで非表示、認証成功で解放） -->
  <div class="board hidden">
    <div class="top-line">
      <span class="dot"></span>
      <span class="label">CLUB CLOCK</span>
      <span class="dot"></span>
    </div>
    <div class="clock">
      <span class="hm-wrap">
        <span class="time" id="hm"></span>
        <span class="seconds" id="sec"></span>
      </span>
    </div>
    <div class="date-row">
      <span class="date" id="date"></span>
      <span class="weekday" id="weekday"></span>
    </div>
  </div>

  <!-- ☕️ 応援ボタン（未購入時は非表示にするため、board内からbody直下へ移動） -->
  <div class="bmc-container hidden">
    <a class="bmc-button" target="_blank" href="https://www.buymeacoffee.com/">☕️ Buy me a coffee</a>
  </div>

  <script>
    // ==========================================
    // ⚙️ Supabase 接続情報の設定
    // ==========================================
    // ⚠️ 下記の「your-project.supabase.co」と「your-anon-key」を、ご自身のSupabaseの設定値に書き換えてください。
    const SUPABASE_URL = 'https://zeppnyfcmqqwwgbeothx.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplcHBueWZjbXFxd3dnYmVvdGh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MzY5NjMsImV4cCI6MjEwMjExMjk2M30.wWodlGbicpwChSmas3YGE996HEs_0NBSqfHCZPTgv78'; 

    let supabaseClient = null;

    // Supabaseの初期設定チェック
    if (SUPABASE_URL.startsWith('https://your-project')) {
      document.getElementById('auth-message').innerHTML = '<span style="color: #ff5c6e; font-weight: bold; font-size: 13px;">【重要】コード内の「SUPABASE_URL」と「SUPABASE_ANON_KEY」の設定を行ってください。</span>';
    } else {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // ==========================================
    // 🔐 認証 ＆ アクセス制限ロジック
    // ==========================================
    async function checkAccess() {
      if (!supabaseClient) return;

      const { data: { user } } = await supabaseClient.auth.getUser();

      // 1. ログインしていない場合 ➔ ログイン画面を表示
      if (!user) {
        document.getElementById('auth-panel').classList.remove('hidden');
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('license-form').style.display = 'none';
        
        document.querySelector('.board').classList.add('hidden');
        document.querySelector('.bmc-container').classList.add('hidden');
        stopClock();
        return;
      }

      // 2. ログインしている場合 ➔ データベースで購入（is_paid）フラグをチェック
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('is_paid')
        .eq('id', user.id)
        .single();

      if (data && data.is_paid) {
        // 購入済み ➔ 認証パネルを隠し、時計アプリを解放！
        document.getElementById('auth-panel').classList.add('hidden');
        document.querySelector('.board').classList.remove('hidden');
        document.querySelector('.bmc-container').classList.remove('hidden');
        startClock();
      } else {
        // ログインはしているが未購入 ➔ ライセンスキー入力画面を表示
        document.getElementById('auth-panel').classList.remove('hidden');
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('license-form').style.display = 'block';
        
        document.querySelector('.board').classList.add('hidden');
        document.querySelector('.bmc-container').classList.add('hidden');
        stopClock();
      }
    }

    // 新規無料会員登録
    async function handleSignUp() {
      if (!supabaseClient) return;
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;

      if (!email || !password) {
        alert('メールアドレスとパスワードを入力してください。');
        return;
      }

      const { error } = await supabaseClient.auth.signUp({ email, password });
      
      if (error) {
        alert('登録エラー: ' + error.message);
      } else {
        alert('登録メールを送信しました！メール内の認証リンクをクリックしてアカウントを有効化してから、再度ログインしてください。');
      }
    }

    // ログイン処理
    async function handleLogin() {
      if (!supabaseClient) return;
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;

      if (!email || !password) {
        alert('メールアドレスとパスワードを入力してください。');
        return;
      }

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      
      if (error) {
        alert('ログイン失敗: ' + error.message);
      } else {
        checkAccess();
      }
    }

    // ライセンスキー有効化
    async function handleActivateKey() {
      if (!supabaseClient) return;
      const key = document.getElementById('license-key').value.trim();
      if (!key) {
        alert('ライセンスキーを入力してください。');
        return;
      }

      // Supabaseのデータベース関数 (activate_license) を呼び出す
      const { data: isSuccess, error } = await supabaseClient.rpc('activate_license', { input_key: key });

      if (error) {
        alert('検証中にエラーが発生しました: ' + error.message);
      } else if (isSuccess) {
        alert('ライセンスの有効化に成功しました！CLUB CLOCKを解放します。');
        checkAccess();
      } else {
        alert('無効なライセンスキー、または既に使用されているキーです。');
      }
    }

    // ログアウト処理
    async function handleLogout() {
      if (!supabaseClient) return;
      await supabaseClient.auth.signOut();
      checkAccess();
    }

    // ==========================================
    // ⏱️ CLUB CLOCK オリジナル時計ロジック
    // ==========================================
    const hmEl = document.getElementById('hm');
    const secEl = document.getElementById('sec');
    const dateEl = document.getElementById('date');
    const weekdayEl = document.getElementById('weekday');
    const days = ['日','月','火','水','木','金','土'];
    let clockIntervalId = null;

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function tick() {
      const now = new Date();
      const h = pad(now.getHours());
      const m = pad(now.getMinutes());
      const s = pad(now.getSeconds());
      hmEl.innerHTML = h + '<span class="colon">:</span>' + m;
      secEl.textContent = s;
      dateEl.textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
      const dIdx = now.getDay();
      weekdayEl.textContent = days[dIdx] + '曜日';
      weekdayEl.className = 'weekday' + (dIdx === 0 ? ' sun' : dIdx === 6 ? ' sat' : '');
    }

    // 時計の制御（認証成功時のみ開始）
    function startClock() {
      tick();
      if (!clockIntervalId) {
        clockIntervalId = setInterval(tick, 1000);
      }
      requestWakeLock();
    }

    function stopClock() {
      if (clockIntervalId) {
        clearInterval(clockIntervalId);
        clockIntervalId = null;
      }
      releaseWakeLock();
    }

    // ==========================================
    // 💡 スリープ防止（Wake Lock API）
    // ==========================================
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        // ログイン＆購入済みの場合のみスリープ防止を適用
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return;

        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake Lock Error:', err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => {
          wakeLock = null;
        });
      }
    }

    document.addEventListener('click', () => {
      if (supabaseClient) requestWakeLock();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        if (supabaseClient) requestWakeLock();
      }
    });

    // 🚀 起動時にアクセス状況を自動チェック
    checkAccess();
  </script>
</body>
</html>
